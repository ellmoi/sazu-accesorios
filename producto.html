<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Producto | Sazu</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="sharedHeader"></div>
    <main class="section">
      <div class="container" id="productDetail"></div>
    </main>
    <div id="sharedFooter"></div>
    <aside class="drawer" id="cartDrawer">
      <div class="backdrop" data-close-drawer></div>
      <div class="drawer-panel">
        <div class="drawer-head">
          <h2>Tu carrito</h2>
          <button class="icon" data-close-drawer>×</button>
        </div>
        <div id="drawerItems" class="drawer-items"></div>
        <div class="total grand">
          <span>Total</span><span data-total></span>
        </div>
        <a class="btn btn-primary" href="checkout.html">Finalizar pedido</a>
      </div>
    </aside>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="js/products.js"></script>
    <script src="js/clients.js"></script>
    <script src="js/orders.js"></script>
    <script src="js/pricing.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
    <script src="js/cart.js"></script>
  </body>
</html>
